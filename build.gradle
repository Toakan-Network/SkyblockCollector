plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://repo.hypixel.net/repository/Hypixel/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Official Hypixel Mod API, used for SkyBlock detection. Required at runtime, installed by the player.
	compileOnly "net.hypixel:mod-api:1.0.2"

	// SkyblockDB: trophies, accessories, item data and prices. Required at runtime, installed by the player.
	// Compiled against its plain-Java API jar (the same jar for every Minecraft version).
	compileOnly files("libs/skyblock-db-api-0.6.0.jar")
	testImplementation files("libs/skyblock-db-api-0.6.0.jar")

	// Unit tests; nothing here ships in the jar.
	testImplementation platform("org.junit:junit-bom:5.14.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Huddable (optional): its editor places the HUD panel when installed. Huddable isn't on a Maven repo, so its API
// is compiled from signature-only copies in src/huddableStub and left out of the jar; only Huddable ever loads
// uk.toakan.tad.skyblockcollector.compat.HuddableCompat (fabric.mod.json entrypoint).
sourceSets.main.java.srcDir "src/huddableStub/java"

jar {
	exclude "uk/toakan/tad/huddable/**"
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}
